<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark">
  <title>DSMNRU PYQ</title>
  <link rel="icon" href="img/emblem.png" type="image/png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!--
    DSMNRU PYQ — dedicated Android app interface (NOT a rendering of the
    website). This shell owns: the top app bar, the routed view container,
    the bottom navigation, sheet/toast/offline overlays. All content is
    app-native markup fed by the existing Cloudflare Worker API only.
  -->
  <div id="app">
    <header id="appbar" class="appbar">
      <button id="appbar-back" class="icon-btn" type="button" aria-label="Back" hidden></button>
      <div id="appbar-title" class="appbar-title" aria-live="polite"></div>
      <div id="appbar-actions" class="appbar-actions"></div>
    </header>

    <div id="net-banner" class="net-banner" role="status" hidden></div>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="Primary">
      <button class="tab" data-tab="home" type="button"><span class="tab-ic"></span><span class="tab-lb">Home</span></button>
      <button class="tab" data-tab="search" type="button"><span class="tab-ic"></span><span class="tab-lb">Search</span></button>
      <button class="tab" data-tab="browse" type="button"><span class="tab-ic"></span><span class="tab-lb">Courses</span></button>
      <button class="tab" data-tab="saved" type="button"><span class="tab-ic"></span><span class="tab-lb">Saved</span></button>
      <button class="tab" data-tab="profile" type="button"><span class="tab-ic"></span><span class="tab-lb">Profile</span></button>
    </nav>
  </div>

  <div id="toasts" class="toast-root" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
