<!DOCTYPE html>
<!--
  DSMNRU PYQ — Android offline / error page (server.errorPath).

  Shown by Capacitor when the main frame fails to load (e.g. the app was
  launched with no network and the site's service worker had no cached copy).
  Must be fully self-contained: no external fonts, images or scripts.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — DSMNRU PYQ</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .icon {
      width: 84px; height: 84px; margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(110, 231, 216, 0.08);
      border: 1px solid rgba(110, 231, 216, 0.22);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.25rem; font-weight: 800; }
    p { color: rgba(203, 213, 225, 0.8); font-size: 0.9rem; line-height: 1.6; margin: 10px 0 22px; }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: #04211d; font-weight: 700; font-size: 0.95rem;
      text-decoration: none; padding: 12px 26px; border-radius: 12px;
    }
    .footnote { margin-top: 26px; font-size: 0.72rem; color: rgba(148, 163, 184, 0.55); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#6ee7d8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="#6ee7d8" stroke="none"/>
      </svg>
    </div>
    <h1>You appear to be offline</h1>
    <p>DSMNRU PYQ couldn&rsquo;t reach the archive. Check your internet connection and try again. Papers you have viewed recently may still be available once the connection returns.</p>
    <a class="btn" href="https://dsmnru-pyq.netlify.app/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#04211d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
      Try again
    </a>
    <div class="footnote">DSMNRU Academic Archive</div>
  </div>
</body>
</html>
