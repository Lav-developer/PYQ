<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSMNRU Admin Panel</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        .card-header {
            background-color: #32a8a0;
            color: white;
            font-weight: bold;
        }
        .list-group-item {
            border: 1px solid rgba(0, 0, 0, 0.125);
            margin-bottom: 0.5rem;
            border-radius: 0.375rem;
        }
        .btn-outline-primary {
            color: #32a8a0;
            border-color: #32a8a0;
        }
        .btn-outline-primary:hover {
            background-color: #32a8a0;
            border-color: #32a8a0;
        }
        .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
        }
        .btn-outline-danger:hover {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .form-label {
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Admin Login</h5>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label" style="color: white;">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Login</button>
                        </form>
                        <div id="loginError" class="mt-3 text-danger" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" style="display: none;">
        <div class="container mt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>DSMNRU Admin Panel</h1>
                <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
            </div>

            <!-- Add PYQ Form -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Add New PYQ</h5>
                </div>
                <div class="card-body">
                    <form id="addPyqForm">
                        <div class="mb-3">
                            <label for="pyqTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="pyqTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="pyqFile" class="form-label">File URL</label>
                            <input type="url" class="form-control" id="pyqFile" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add PYQ</button>
                    </form>
                </div>
            </div>

            <!-- Add Syllabus Form -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Add New Syllabus</h5>
                </div>
                <div class="card-body">
                    <form id="addSyllabusForm">
                        <div class="mb-3">
                            <label for="syllabusTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="syllabusTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="syllabusFile" class="form-label">File URL</label>
                            <input type="url" class="form-control" id="syllabusFile" required>
                        </div>
                        <div class="mb-3">
                            <label for="syllabusCourse" class="form-label">Course (optional)</label>
                            <input type="text" class="form-control" id="syllabusCourse">
                        </div>
                        <div class="mb-3">
                            <label for="syllabusSemester" class="form-label">Semester (optional)</label>
                            <input type="text" class="form-control" id="syllabusSemester">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Syllabus</button>
                    </form>
                </div>
            </div>

            <!-- PYQs List -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Manage PYQs</h5>
                </div>
                <div class="card-body">
                    <div id="pyqsList" class="list-group">
                        <!-- PYQs will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Syllabus List -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Manage Syllabus</h5>
                </div>
                <div class="card-body">
                    <div id="syllabusList" class="list-group">
                        <!-- Syllabus will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Item</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editForm">
                            <input type="hidden" id="editType">
                            <input type="hidden" id="editIndex">
                            <div class="mb-3">
                                <label for="editTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="editTitle" required>
                            </div>
                            <div class="mb-3">
                                <label for="editFile" class="form-label">File URL</label>
                                <input type="url" class="form-control" id="editFile" required>
                            </div>
                            <div class="mb-3" id="editCourseDiv" style="display: none;">
                                <label for="editCourse" class="form-label">Course</label>
                                <input type="text" class="form-control" id="editCourse">
                            </div>
                            <div class="mb-3" id="editSemesterDiv" style="display: none;">
                                <label for="editSemester" class="form-label">Semester</label>
                                <input type="text" class="form-control" id="editSemester">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>

    <!-- Realtime Chat Button (opens external chat) for admin -->
    <div id="chatWidget" class="chat-widget" aria-hidden="true">
        <button id="chatToggleBtn" class="chat-toggle" aria-pressed="false" aria-label="Open chat" onclick="toggleChatWidget()">
            <i class="fas fa-comments"></i>
        </button>
    </div>
</body>
</html>
