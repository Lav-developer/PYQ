name: Android APK

# Builds the DSMNRU PYQ debug APK on a GitHub-hosted runner.
# No Android Studio or local Android SDK is required — the runner provides
# Node, JDK 21 and the Android SDK; Gradle comes from the project wrapper.
#
# The APK is uploaded as a workflow artifact only (never committed, no
# releases are created). A `checks` job runs the Node test suites first so a
# broken app-logic change can't produce a green APK build unnoticed.
on:
  workflow_dispatch:
  push:
    branches:
      - android-app
    paths:
      - 'android-app/**'
      - 'worker/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: App logic + Worker API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            android-app/package-lock.json
            worker/package-lock.json

      # The Android app's unit tests + jsdom smoke test are dependency-free
      # Node tests (jsdom is reused from the Worker devDependencies below).
      - name: Install Worker test dependencies
        run: npm ci --prefix worker --no-audit --no-fund

      - name: Run Worker API suite (unchanged backend contract)
        run: |
          node worker/test/worker.test.js
          node worker/test/frontend-smoke-test.cjs
          node worker/test/paper-smoke-test.cjs
          node worker/test/contribution-points-test.cjs
          node worker/test/duplicate-detection-test.cjs
          node worker/test/duplicate-index-freshness-test.cjs
          node worker/test/admin-ia-test.cjs

      - name: Run Android app logic + UI smoke tests
        run: npm test --prefix android-app

  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up Java 21 (Gradle/AGP requirement)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install JS dependencies
        working-directory: android-app
        run: npm ci

      - name: Sync Capacitor Android project
        # Regenerates android/app/src/main/assets (www copy + capacitor config)
        # and the generated gradle includes from the installed npm plugins.
        working-directory: android-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          # tee keeps the step's exit code (pipefail) while capturing the log —
          # the tail lands in the step summary so compile errors are readable
          # via the API even where the raw log download is not available.
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build-log.txt
          { echo "## Gradle build output (tail)"; echo '```'; tail -n 150 build-log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Show APK details
        run: ls -lh android-app/android/app/build/outputs/apk/debug/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsmnru-pyq-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
