[build]
command = "npm run build"
functions = "netlify/functions"
publish = "."

[dev]
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[env.production]
[env.production.context.production.environment]
NODE_ENV = "production"
