[build]
  publish = "."

# Static multi-page site: do not add an SPA catch-all. Existing files retain
# their own URLs and Netlify serves 404.html for unknown paths.
#
# These are intentional external *rewrites*, not browser redirects. They let
# the Worker server-render public SEO pages on the Netlify canonical hostname;
# `force = true` makes the dynamic sitemap win over the legacy physical file.
[[redirects]]
from = "/pyq/*"
to = "https://dsmnru-pyq-api.kush210431-cloudflare.workers.dev/pyq/:splat"
status = 200
force = true

[[redirects]]
from = "/sitemap.xml"
to = "https://dsmnru-pyq-api.kush210431-cloudflare.workers.dev/sitemap.xml"
status = 200
force = true

[[redirects]]
from = "/index.html"
to = "/"
status = 301
force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Frontend assets moved under /assets/ (css, js, icons, images). One rule covers
# them all so the previous 1-week cache behaviour is preserved exactly.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Root-level scripts (sw.js stays at root to keep its "/" scope).
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/paper.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow, noarchive"

[[headers]]
  for = "/tools.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow, noarchive"
